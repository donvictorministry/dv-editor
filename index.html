<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1877F2">
<meta name="description" content="DV-Editor — mobile code editor and web project sandbox">
<title>DV-Editor</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231877F2'/%3E%3Ctext x='12' y='17' font-size='13' fill='white' text-anchor='middle' font-family='Roboto,sans-serif' font-weight='700'%3EDV%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============ LANDING PAGE ============ -->
<div id="dv-landing" class="dv-screen dv-screen-active">

  <header id="dv-landing-header" class="dv-header">
    <button id="dv-left-menu-btn" class="dv-icon-btn" aria-label="Menu">
      <svg viewBox="0 0 24 24" class="dv-icon"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <h1 class="dv-title">DV-Editor</h1>
    <button id="dv-right-menu-btn" class="dv-icon-btn" aria-label="Settings">
      <svg viewBox="0 0 24 24" class="dv-icon"><circle cx="12" cy="5" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="19" r="1.8" fill="currentColor"/></svg>
    </button>
  </header>

  <div id="dv-landing-body" class="dv-landing-body">
    <div id="dv-empty-state" class="dv-empty-state">
      <svg viewBox="0 0 24 24" class="dv-empty-icon"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M14 2v6h6" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
      <p>No files or projects yet</p>
      <span>Tap the + button to start coding</span>
    </div>
    <ul id="dv-file-list" class="dv-file-list"></ul>
  </div>

  <button id="dv-fab" class="dv-fab" aria-label="New file">
    <svg viewBox="0 0 24 24" class="dv-icon"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
  </button>
</div>

<!-- ============ EDITOR WORKSPACE MODAL ============ -->
<div id="dv-editor-modal" class="dv-screen dv-editor-screen">

  <header class="dv-editor-header">
    <button id="dv-editor-back" class="dv-icon-btn" aria-label="Close editor">
      <svg viewBox="0 0 24 24" class="dv-icon"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span id="dv-editor-filename" class="dv-editor-filename">Untitled</span>
  </header>

  <!-- Horizontally scrollable toolsbar -->
  <div id="dv-toolsbar" class="dv-toolsbar">
    <button class="dv-tool-btn" data-action="new" aria-label="New">
      <svg viewBox="0 0 24 24" class="dv-icon"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>New</span>
    </button>
    <button class="dv-tool-btn" data-action="undo" aria-label="Undo">
      <svg viewBox="0 0 24 24" class="dv-icon"><path d="M9 14l-4-4 4-4M5 10h9a5 5 0 0 1 0 10h-1" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Undo</span>
    </button>
    <button class="dv-tool-btn" data-action="redo" aria-label="Redo">
      <svg viewBox="0 0 24 24" class="dv-icon"><path d="M15 14l4-4-4-4M19 10h-9a5 5 0 0 0 0 10h1" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Redo</span>
    </button>
    <button class="dv-tool-btn" data-action="paste" aria-label="Paste">
      <svg viewBox="0 0 24 24" class="dv-icon"><path d="M9 3h6v3H9zM6 6h12v15H6z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/></svg><span>Paste</span>
    </button>
    <button class="dv-tool-btn" data-action="copy" aria-label="Copy">
      <svg viewBox="0 0 24 24" class="dv-icon"><rect x="9" y="9" width="12" height="12" rx="1.5" stroke="currentColor" stroke-width="2" fill="none"/><path d="M5 15V5a2 2 0 0 1 2-2h10" stroke="currentColor" stroke-width="2" fill="none"/></svg><span>Copy</span>
    </button>
    <button class="dv-tool-btn" data-action="delete" aria-label="Delete">
      <svg viewBox="0 0 24 24" class="dv-icon"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Delete</span>
    </button>
    <button class="dv-tool-btn" data-action="save" aria-label="Save">
      <svg viewBox="0 0 24 24" class="dv-icon"><path d="M5 3h11l3 3v15H5V3z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M8 3v6h8V3M8 21v-8h8v8" stroke="currentColor" stroke-width="2" fill="none"/></svg><span>Save</span>
    </button>
    <button class="dv-tool-btn dv-tool-toggle" data-action="line" aria-label="Toggle line numbers">
      <svg viewBox="0 0 24 24" class="dv-icon"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Line</span>
    </button>
    <button class="dv-tool-btn dv-tool-toggle" data-action="wrap" aria-label="Toggle word wrap">
      <svg viewBox="0 0 24 24" class="dv-icon"><path d="M3 6h18M3 12h13a3 3 0 0 1 0 6h-3l2-2m-2 2l2 2M3 18h4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Wrap</span>
    </button>
    <button class="dv-tool-btn" data-action="search" aria-label="Search">
      <svg viewBox="0 0 24 24" class="dv-icon"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Search</span>
    </button>
    <button class="dv-tool-btn dv-tool-preview" data-action="preview" aria-label="Preview">
      <svg viewBox="0 0 24 24" class="dv-icon"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/></svg><span>Preview</span>
    </button>
  </div>

  <!-- File tabs: HTML / CSS / JS -->
  <div id="dv-file-tabs" class="dv-file-tabs">
    <button class="dv-tab dv-tab-active" data-tab="html">HTML</button>
    <button class="dv-tab" data-tab="css">CSS</button>
    <button class="dv-tab" data-tab="js">JS</button>
  </div>

  <div id="dv-editor-wrap" class="dv-editor-wrap">
    <div id="dv-cm-html" class="dv-cm-pane dv-cm-pane-active"><textarea id="dv-ta-html"></textarea></div>
    <div id="dv-cm-css" class="dv-cm-pane"><textarea id="dv-ta-css"></textarea></div>
    <div id="dv-cm-js" class="dv-cm-pane"><textarea id="dv-ta-js"></textarea></div>
  </div>
</div>

<!-- ============ PREVIEW ============ -->
<div id="dv-preview-screen" class="dv-screen dv-preview-screen">
  <button id="dv-preview-close" class="dv-preview-close" aria-label="Close preview">
    <svg viewBox="0 0 24 24" class="dv-icon"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>
  <iframe id="dv-preview-frame" class="dv-preview-frame" title="Live Preview" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe>
</div>

<!-- ============ LEFT SIDEBAR MENU ============ -->
<div id="dv-left-overlay" class="dv-overlay"></div>
<nav id="dv-left-sidebar" class="dv-sidebar dv-sidebar-left">
  <div class="dv-sidebar-header">
    <span class="dv-sidebar-title">Menu</span>
    <button class="dv-icon-btn dv-sidebar-close" data-close="left" aria-label="Close menu">
      <svg viewBox="0 0 24 24" class="dv-icon"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <ul class="dv-sidebar-list">
    <li><button class="dv-sidebar-item" data-panel="about-app">About the App</button></li>
    <li><button class="dv-sidebar-item" data-panel="about-dev">About the Developer</button></li>
    <li><button class="dv-sidebar-item" data-panel="how-to-use">How to Use</button></li>
    <li><button class="dv-sidebar-item" data-panel="proprietary">Proprietary Software Notice</button></li>
    <li><button class="dv-sidebar-item" data-panel="terms">Terms of Use</button></li>
    <li><button class="dv-sidebar-item" data-panel="contact">Contact for Permission</button></li>
    <li><button class="dv-sidebar-item" data-close="left">Exit</button></li>
  </ul>
</nav>

<!-- ============ RIGHT SIDEBAR MENU ============ -->
<div id="dv-right-overlay" class="dv-overlay"></div>
<nav id="dv-right-sidebar" class="dv-sidebar dv-sidebar-right">
  <div class="dv-sidebar-header">
    <span class="dv-sidebar-title">Settings</span>
    <button class="dv-icon-btn dv-sidebar-close" data-close="right" aria-label="Close settings">
      <svg viewBox="0 0 24 24" class="dv-icon"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="dv-settings-body">

    <div class="dv-settings-group">
      <span class="dv-settings-label">Accent Color</span>
      <div id="dv-accent-grid" class="dv-accent-grid"></div>
    </div>

    <div class="dv-settings-group">
      <span class="dv-settings-label">Font</span>
      <select id="dv-font-select" class="dv-select">
        <option value="Roboto">Roboto</option>
        <option value="Roboto Mono">Roboto Mono</option>
        <option value="monospace">Monospace</option>
        <option value="sans-serif">Sans-serif</option>
      </select>
    </div>

    <div class="dv-settings-group">
      <span class="dv-settings-label">Font Scale <span id="dv-font-scale-val">100%</span></span>
      <input id="dv-font-scale" class="dv-slider" type="range" min="80" max="150" step="5" value="100">
    </div>

    <div class="dv-settings-group dv-settings-row">
      <span class="dv-settings-label">Dark Mode</span>
      <label class="dv-switch">
        <input id="dv-dark-toggle" type="checkbox">
        <span class="dv-switch-slider"></span>
      </label>
    </div>

    <ul class="dv-sidebar-list">
      <li><button id="dv-install-btn" class="dv-sidebar-item">Install App</button></li>
      <li><button id="dv-share-app-btn" class="dv-sidebar-item">Share App</button></li>
      <li><button class="dv-sidebar-item" data-close="right">Exit</button></li>
    </ul>
  </div>
</nav>

<!-- ============ INFO PANEL (About/Terms/etc) ============ -->
<div id="dv-info-overlay" class="dv-overlay"></div>
<div id="dv-info-panel" class="dv-info-panel">
  <div class="dv-info-header">
    <span id="dv-info-title" class="dv-info-title">Info</span>
    <button id="dv-info-close" class="dv-icon-btn" aria-label="Close">
      <svg viewBox="0 0 24 24" class="dv-icon"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div id="dv-info-content" class="dv-info-content"></div>
</div>

<!-- ============ GENERIC CENTERED MODALS ============ -->
<div id="dv-modal-overlay" class="dv-overlay"></div>

<div id="dv-modal-confirm" class="dv-modal">
  <p id="dv-modal-confirm-text" class="dv-modal-text">Are you sure?</p>
  <div class="dv-modal-actions">
    <button id="dv-modal-confirm-cancel" class="dv-btn dv-btn-ghost">Cancel</button>
    <button id="dv-modal-confirm-ok" class="dv-btn dv-btn-danger">Delete</button>
  </div>
</div>

<div id="dv-modal-save" class="dv-modal">
  <p class="dv-modal-text">Save File</p>
  <input id="dv-modal-save-input" class="dv-modal-input" type="text" placeholder="Enter filename" maxlength="60">
  <div class="dv-modal-actions">
    <button id="dv-modal-save-cancel" class="dv-btn dv-btn-ghost">Cancel</button>
    <button id="dv-modal-save-ok" class="dv-btn dv-btn-primary">Save</button>
  </div>
</div>

<div id="dv-modal-search" class="dv-modal">
  <p class="dv-modal-text">Search</p>
  <input id="dv-modal-search-input" class="dv-modal-input" type="text" placeholder="Find in editor">
  <div class="dv-modal-actions">
    <button id="dv-modal-search-cancel" class="dv-btn dv-btn-ghost">Cancel</button>
    <button id="dv-modal-search-ok" class="dv-btn dv-btn-primary">Search</button>
  </div>
</div>

<div id="dv-modal-rename" class="dv-modal">
  <p class="dv-modal-text">Rename</p>
  <input id="dv-modal-rename-input" class="dv-modal-input" type="text" placeholder="New name" maxlength="60">
  <div class="dv-modal-actions">
    <button id="dv-modal-rename-cancel" class="dv-btn dv-btn-ghost">Cancel</button>
    <button id="dv-modal-rename-ok" class="dv-btn dv-btn-primary">Rename</button>
  </div>
</div>

<!-- File row context menu -->
<div id="dv-context-menu" class="dv-context-menu">
  <button class="dv-context-item" data-menu="rename">Rename</button>
  <button class="dv-context-item" data-menu="edit">Edit</button>
  <button class="dv-context-item" data-menu="open">Open</button>
  <button class="dv-context-item" data-menu="delete">Delete</button>
  <button class="dv-context-item" data-menu="share">Share</button>
  <button class="dv-context-item" data-menu="exit">Exit</button>
</div>

<!-- Toast container -->
<div id="dv-toast" class="dv-toast"></div>

<!-- CodeMirror core -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/searchcursor.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/search.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
<script src="scripts.js"></script>
</body>
</html>
